name: Update thread grids

on:
  push:
    branches: [main]
    paths-ignore:
      - "threads/**/README.md"

permissions:
  contents: write

jobs:
  update-grids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install feedparser

      - run: python scripts/update_grids.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh thread grids [skip ci]"
          file_pattern: "threads/**/README.md"